name: Django CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Django checks and test suite
        run: |
          cd backend
          python -c "import django; print('Installed Django version:', django.__version__)"
          if [ -f config/settings.py ]; then
            python manage.py check
            python manage.py migrate --noinput
            python manage.py test tests
          else
            echo "Django dependency verified. Ready for backend implementation and test suite."
          fi
