name: Django CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every OS/Python combination finish so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for unapplied or missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run pytest smoke suite
        run: python -m pytest -v

      - name: Run Django test suite
        working-directory: backend
        run: python manage.py test tests -v 2

  coverage:
    name: Code & branch coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run tests with branch coverage
        working-directory: backend
        run: |
          python -m coverage run manage.py test tests
          python -m coverage report
          python -m coverage html
          python -m coverage xml

      - name: Publish coverage summary
        working-directory: backend
        run: |
          echo '## Coverage (statements + branches)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=text | tail -n 25 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 30
